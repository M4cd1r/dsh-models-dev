# Publish dsh-models-dev to npm via Trusted Publishing (OIDC) — no NPM_TOKEN.
#
# npmjs.com trusts this exact repo + workflow file (configured as the package's
# Trusted Publisher: owner M4cd1r, repo dsh-models-dev, workflow release.yml).
# The npm CLI exchanges the GitHub OIDC token automatically (npm >= 11.5.1).
#
# A tag run also cuts the matching GitHub release (auto-generated notes) once —
# and only once — the npm publish succeeded, so a failed publish never leaves a
# release pointing at an unpublished version.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with OIDC trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies (no lifecycle scripts)
        run: npm install --ignore-scripts

      - name: Verify (syntax + unit tests + smoke)
        run: npm run verify

      - name: Publish to npm
        run: npm publish --access public --provenance

      # Tag runs finish with the matching GitHub release; a manual dispatch
      # publishes from a branch ref and has no version to announce.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "dsh-models-dev $GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ github.token }}
