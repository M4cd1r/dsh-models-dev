# Publish dsh-models-dev to npm via Trusted Publishing (OIDC) — no NPM_TOKEN.
#
# npmjs.com trusts this exact repo + workflow file (configured as the package's
# Trusted Publisher: owner M4cd1r, repo dsh-models-dev, workflow release.yml).
# The npm CLI exchanges the GitHub OIDC token automatically (npm >= 11.5.1).
#
# Bootstrap note: npm can only configure a Trusted Publisher for an existing
# package (npm/cli#8544), so the first publish falls back to the NPM_TOKEN
# secret. Once Trusted Publishing is enabled on npmjs.com, the secret and the
# env below are removed and OIDC takes over.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with OIDC trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies (no lifecycle scripts)
        run: npm install --ignore-scripts

      - name: Verify (syntax + unit tests + smoke)
        run: npm run verify

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          # Bootstrap only (package must exist before a Trusted Publisher can be
          # configured on npmjs.com — npm/cli#8544). Once Trusted Publishing is
          # enabled for this package, this secret is removed and OIDC takes over.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
